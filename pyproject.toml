[project]
name = "vgi-nhl"
version = "0.2.0"
description = "A read-only VGI worker exposing NHL standings, schedules, game detail, and player statistics to Haybarn SQL"
readme = "README.md"
license = "MIT"
authors = [{ name = "Query Farm", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "nhl", "hockey", "ice hockey", "standings"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
requires-python = ">=3.13"
dependencies = [
    "vgi-python[http]>=0.51.0,<0.52",
    "httpx>=0.27,<1",
    "pyarrow>=18,<26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6,<8",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://query.farm"
Documentation = "https://github.com/Query-farm/vgi-nhl#readme"
Repository = "https://github.com/Query-farm/vgi-nhl"
Issues = "https://github.com/Query-farm/vgi-nhl/issues"

[project.scripts]
vgi-nhl = "vgi_nhl.worker:main"
vgi-nhl-http = "vgi_nhl.worker:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_nhl"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/dist",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the public NHL web and stats APIs"]
